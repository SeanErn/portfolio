name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cv:
    name: Render public CV (no phone number)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install RenderCV and the Carlito font
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-crosextra-carlito
          pip install "rendercv[full]==2.8"

      - name: Render public CV (no phone number)
        run: |
          rendercv render cv/resume.yaml --output-folder "$PWD/build/cv" \
            --dont-generate-png --dont-generate-html
          mv build/cv/Sean_Ernstes_RESUME.pdf build/cv/Sean_Ernstes_Resume.pdf

      - uses: actions/upload-artifact@v7
        with:
          name: cv
          path: |
            build/cv/Sean_Ernstes_Resume.pdf
            build/cv/*.md

  site:
    name: Build website
    needs: cv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Use the freshly rendered CV
        uses: actions/download-artifact@v8
        with:
          name: cv
          path: build/cv

      - run: cp build/cv/Sean_Ernstes_Resume.pdf static/Sean_Ernstes_Resume.pdf

      - run: npm run check

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: .svelte-kit/output
          retention-days: 14
