name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cv:
    name: Render public CV (no phone number)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install RenderCV and the Carlito font
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-crosextra-carlito
          pip install "rendercv[full]==2.8"

      - name: Render public CV (no phone number)
        run: node scripts/render-cv.mjs public build/cv

      - uses: actions/upload-artifact@v7
        with:
          name: cv
          path: build/cv/Sean_Ernstes_Resume.pdf

  site:
    name: Build website
    needs: cv
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Use the freshly rendered CV
        uses: actions/download-artifact@v8
        with:
          name: cv
          path: .cv-out

      - run: cp .cv-out/Sean_Ernstes_Resume.pdf static/Sean_Ernstes_Resume.pdf

      - run: npm run check

      # tells us the path Pages serves the site from (/portfolio now, '' with a custom domain)
      - id: pages
        if: vars.PUBLISH_SITE == 'true'
        uses: actions/configure-pages@v6

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}

      - if: vars.PUBLISH_SITE == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  # Off until the repo variable PUBLISH_SITE is 'true' (see README: "Publishing the site").
  deploy:
    name: Publish to GitHub Pages
    needs: site
    if: vars.PUBLISH_SITE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
