name: Private CV

# When the CV changes, render the full résumé (phone number filled in from the CV_PHONE secret) and
# save it as a DRAFT release. Drafts are visible only to people with write access to this repo, so
# the PDF stays private even though the repo is public. Never press "Publish" on one.
on:
  push:
    branches: [main]
    paths:
      - cv/**
      - scripts/render-cv.mjs
      - .github/workflows/cv.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-cv
  cancel-in-progress: false

jobs:
  draft:
    name: Render full CV as a draft release
    runs-on: ubuntu-latest
    env:
      CV_PHONE: ${{ secrets.CV_PHONE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install RenderCV and the Carlito font
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-crosextra-carlito
          pip install "rendercv[full]==2.8"

      - name: Render full CV
        run: node scripts/render-cv.mjs full build/cv

      - name: Save as a draft release
        run: |
          gh release create "cv-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" build/cv/Sean_Ernstes_Resume.pdf \
            --draft \
            --title "PRIVATE · do not publish · Résumé $(date -u +%Y-%m-%d)" \
            --notes "Full résumé with phone number, rendered from cv/resume.yaml at ${GITHUB_SHA::7}. This is a draft on purpose: publishing it would make it public."
