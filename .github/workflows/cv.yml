name: Sync CV

# When cv/resume.yaml changes, push it to the private SeanErn/cv-private repo, which renders the
# full résumé (with the phone number) and publishes it there. Nothing private lives in this repo:
# CV_SYNC_KEY is a deploy key that can only write to cv-private.
on:
  push:
    branches: [main]
    paths:
      - cv/**
      - .github/workflows/cv.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cv
  cancel-in-progress: false

jobs:
  sync:
    name: Push resume.yaml to cv-private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Push to SeanErn/cv-private
        env:
          SYNC_KEY: ${{ secrets.CV_SYNC_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SYNC_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 git@github.com:SeanErn/cv-private.git private
          cp cv/resume.yaml private/resume.yaml
          cd private
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.yaml
          if git diff --cached --quiet; then
            echo "cv-private already has this resume.yaml."
            exit 0
          fi
          git commit -m "Sync resume.yaml from signal-path@${GITHUB_SHA::7}"
          git push origin HEAD:main
